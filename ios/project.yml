# XcodeGen project for Temple of the High Priestess (iOS shell around the bundled web game).
#   scripts/ios-sync-web.sh && cd ios && xcodegen generate
# ASC app "Temple of the High Priestess" (Apple ID 6819973123, SKU High-priestess-game), team 83D36RPMUM.
name: HighPriestess
options:
  bundleIdPrefix: com.ragnus
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    DEVELOPMENT_TEAM: 83D36RPMUM
configs:
  Debug: debug
  Release: release
targets:
  HighPriestess:
    type: application
    platform: iOS
    sources:
      - path: HighPriestess
        excludes:
          - "**/*.md"
          - "Resources/PrivacyInfo.xcprivacy"
      # The web game (index.html, js/, css/, assets/, audio/), copied by scripts/ios-sync-web.sh.
      # Folder reference -> HighPriestess.app/Web/..., served to WKWebView at app://game/.
      - path: WebBundle/Web
        type: folder
        buildPhase: resources
    resources:
      - path: HighPriestess/Resources/PrivacyInfo.xcprivacy
    settings:
      base:
        INFOPLIST_FILE: HighPriestess/Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: com.ragnus.weather
        PRODUCT_NAME: HighPriestess
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 83D36RPMUM
        ENABLE_TESTABILITY: YES
  HighPriestessTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HighPriestessTests
    dependencies:
      - target: HighPriestess
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ragnus.weather.tests
        PRODUCT_NAME: HighPriestessTests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 83D36RPMUM
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HighPriestess.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/HighPriestess"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  HighPriestess:
    build:
      targets:
        HighPriestess: all
        HighPriestessTests: [test]
    test:
      targets:
        - HighPriestessTests
