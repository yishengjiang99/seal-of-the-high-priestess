name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - copilot/improve-js-content-dialog-files
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          # Native app, save server and App Store docs are not part of the web game.
          exclude_assets: '.github,ios,server,docs,tools,assets/lina-ref.jpg,node_modules'
