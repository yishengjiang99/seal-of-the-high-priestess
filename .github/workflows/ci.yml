name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'ios/**'
      - 'server/**'
      - 'docs/**'
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths-ignore:
      - 'ios/**'
      - 'server/**'
      - 'docs/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: JavaScript syntax checks
        run: |
          node --check js/content.js
          node --check js/dialogue.js
          node --check js/game.js
          node --check js/maps.js
          node --check js/world.js
          node --check js/voice-lines.js
          node --check scripts/generate-voice.mjs
          node --check scripts/voice-lib.mjs

      - name: Unit tests (voice pipeline + world integrity)
        run: npm run test:unit

      - name: Voice clip coverage
        run: |
          node scripts/generate-voice.mjs --dry-run | tee voice-plan.txt
          if ! grep -q " 0 to generate" voice-plan.txt; then
            echo "::warning::Some dialogue lines have no clip yet; run the 'Generate voice clips' workflow (they play as text-only until then)."
          fi

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run headless browser suite
        run: npm run test:headless

      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1

      - name: Capture headless Chrome screenshot
        env:
          CHROME_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 -m http.server 8080 &
          server_pid=$!
          trap 'kill $server_pid' EXIT

          server_ready=0
          for _ in {1..20}; do
            if curl -sSf http://127.0.0.1:8080/index.html >/dev/null; then
              server_ready=1
              break
            fi
            sleep 1
          done

          if [ "$server_ready" -ne 1 ]; then
            echo "Local server did not start in time"
            exit 1
          fi

          "$CHROME_BIN" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=1366,768 \
            --screenshot=artifacts/homepage.png \
            http://127.0.0.1:8080/index.html

          "$CHROME_BIN" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --dump-dom http://127.0.0.1:8080/index.html > artifacts/dom.html

          cp assets/screenshots/*.png artifacts/ 2>/dev/null || true

          if ! grep -q "Temple of the High Priestess" artifacts/dom.html; then
            echo "Expected title text was not found in DOM output"
            exit 1
          fi

          test -s artifacts/homepage.png

      - name: Upload screenshot artifact
        id: upload-artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: headless-chrome-screenshot
          path: artifacts/
          if-no-files-found: ignore

      - name: Post screenshot to PR comment
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        env:
          ARTIFACT_URL: ${{ steps.upload-artifact.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            const marker = '<!-- ci-headless-chrome-screenshot -->';
            const artifactUrl = process.env.ARTIFACT_URL;
            const runUrl = process.env.RUN_URL;
            const body = [
              marker,
              '### Headless Chrome screenshot',
              artifactUrl
                ? `- [Download screenshot artifact](${artifactUrl})`
                : '- Screenshot artifact unavailable for this run.',
              `- [Workflow run details](${runUrl})`
            ].join('\n');

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number
            });

            const existing = comments.find(
              (comment) =>
                comment.user?.type === 'Bot' &&
                comment.user?.login === 'github-actions[bot]' &&
                comment.body?.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
