name: ASC Game Center

# GAME_CENTER capability on the App ID, Game Center detail, achievements (with images) and boss-time
# leaderboards from ios/GameCenter/gamecenter.json. Idempotent. Never deletes, never submits.
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Also attach Game Center + release all achievements/leaderboards to this App Store version (empty = skip)"
        required: false
        type: string
      release_dry_run:
        description: Dry run for the release step
        type: boolean
        default: true

jobs:
  gc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          ASC_APP_ID: "6819973123"
        run: |
          set -euo pipefail
          pip install -q PyJWT cryptography
          cd scripts/asc && python3 game_center.py
      - if: ${{ inputs.release_version != '' }}
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          ASC_APP_ID: "6819973123"
          VERSION_STRING: ${{ inputs.release_version }}
          DRY_RUN: ${{ inputs.release_dry_run && '1' || '0' }}
        run: cd scripts/asc && python3 game_center_release.py
