name: ASC Game Center

# GAME_CENTER capability on the App ID, Game Center detail, achievements (with images) and boss-time
# leaderboards from ios/GameCenter/gamecenter.json. Idempotent. Never deletes, never submits.
on:
  workflow_dispatch:

jobs:
  gc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          ASC_APP_ID: "6819973123"
        run: |
          set -euo pipefail
          pip install -q PyJWT cryptography
          cd scripts/asc && python3 game_center.py
