    # Temple of the High Priestess API (yishengjiang99/seal-of-the-high-priestess server/, systemd temple-api on 127.0.0.1:8791)
    location ^~ /high-priestess/api/ {
        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 4m;
        add_header X-Content-Type-Options "nosniff" always;
    }
    # Temple of the High Priestess support/privacy/terms (static, /var/www/high-priestess; source docs/legal/high-priestess)
    location = /high-priestess { return 301 /high-priestess/; }
    location ^~ /high-priestess/ {
        root /var/www;
        index index.html;
        try_files $uri $uri.html $uri/ =404;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "public, max-age=3600" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

